name: Build & Release APK (Beta)

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Download Android keystore (opcional, sobrescribe el keystore público del repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "KEYSTORE_FILE=keystore.jks" >> $GITHUB_ENV
          fi

      - name: Configure signing (opcional)
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            cat > android/key.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (no bloqueante)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Test
        run: flutter test

      - name: Compute version
        id: version
        run: |
          RUN=${{ github.run_number }}
          echo "name=1.${RUN}.0" >> $GITHUB_OUTPUT
          echo "code=$((RUN + 100))" >> $GITHUB_OUTPUT

      - name: Build APKs por ABI (release)
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.code }}

      - name: Copy split APKs
        env:
          VN: ${{ steps.version.outputs.name }}
          VC: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p output
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "output/pixel-car-player-${VN}-${VC}-${abi}.apk"
          done

      - name: Build APK universal (release)
        env:
          VN: ${{ steps.version.outputs.name }}
          VC: ${{ steps.version.outputs.code }}
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --build-name "$VN" --build-number "$VC"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "output/pixel-car-player-${VN}-${VC}-universal.apk"
          ls -lh output

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in output/*.apk; do
            echo "== $f"
            "$APKSIGNER" verify --print-certs "$f" 2>&1 | grep -E 'Signer #1 certificate (DN|SHA-256)' || echo "(no se pudo leer la firma; se continúa)"
          done

      - name: Generate release notes
        env:
          VN: ${{ steps.version.outputs.name }}
          VC: ${{ steps.version.outputs.code }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log --no-merges --pretty='- %s (%h)' "${PREV}..HEAD" | head -20 > output/commits.txt
          else
            git log --no-merges --pretty='- %s (%h)' -20 > output/commits.txt
          fi
          [ -s output/commits.txt ] || echo "- (sin cambios desde la versión anterior)" > output/commits.txt

          cat > output/release-notes.md <<EOF
          # Pixel Car Player ${VN}

          Build automático desde \`${BRANCH}\` (commit ${SHA:0:7}), versionCode ${VC}.

          ## Qué APK instalar
          | APK | Cuándo usarlo |
          |---|---|
          | \`pixel-car-player-${VN}-${VC}-arm64-v8a.apk\` | Celulares modernos y la mayoría de tabletas de 64 bits. |
          | \`pixel-car-player-${VN}-${VC}-armeabi-v7a.apk\` | Head units / radios Android viejos (32 bits). **Si el arm64 no instala en la tableta del carro, prueba este.** |
          | \`pixel-car-player-${VN}-${VC}-x86_64.apk\` | Emuladores y dispositivos x86. |
          | \`pixel-car-player-${VN}-${VC}-universal.apk\` | Funciona en cualquier dispositivo (pesa más). Si dudas, usa este. |

          ## Actualizar
          Instala el APK nuevo **encima** del anterior: conserva tus datos y configuración
          (todos los builds usan la misma clave de firma).

          ## Cambios recientes
          EOF
          cat output/commits.txt >> output/release-notes.md
          printf '\n> Build **Beta**. Puede contener bugs.\n' >> output/release-notes.md
          rm output/commits.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-car-player-apk
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release (Beta)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Pixel Car Player ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: output/release-notes.md
          files: output/*.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
